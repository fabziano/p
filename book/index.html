<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livros</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><path fill='%238ae234' d='M12.75,3H5.25A1.15,1.15,0,0,0,4,4V33H14V4A1.15,1.15,0,0,0,12.75,3Z'/><path fill='%238ae234' d='M33.77,31.09l-6.94-18.3a1,1,0,0,0-1.29-.58L22,13.59V9a1,1,0,0,0-1-1H16V33h6V14.69L28.93,33Z'/></svg>">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:sans-serif;background-color:#121212;color:#e0e0e0;padding:2rem 1rem}
    .container{max-width:1200px;margin:0 auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1.5rem}
    .item-wrapper{display:flex;flex-direction:column;align-items:center;max-width:200px;margin:0 auto;width:100%}
    .card{background-color:#1e1e1e;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;border:1px solid #2d2d2d;width:100%}
    .thumb-wrapper{width:100%;height:260px;background-color:#2a2a2a;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .thumb-wrapper img{width:100%;height:100%;object-fit:cover}
    .card-title{margin-top:.5rem;font-size:.9rem;font-weight:600;line-height:1.3;color:#e0e0e0;text-decoration:none;text-align:center;width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;max-height:2.6em;word-break:break-word}
    .loading,.error{text-align:center;grid-column:1/-1;font-size:1.1rem;padding:2rem;color:#a0a0a0}
    .error{color:#cf6679}
    .upload-btn{background:#8ae234;color:#000;font-weight:600;padding:.8rem 1.8rem;border-radius:6px;cursor:pointer;display:inline-block;margin:3rem auto;text-align:center}
    .upload-wrapper{text-align:center}
    input[type="file"]{display:none}
    .hidden{display:none!important}
  </style>
</head>
<body>

  <div class="container">
    <div id="uploadWrapper" class="upload-wrapper hidden">
      <label for="fileInput" class="upload-btn">Enviar</label>
      <input type="file" id="fileInput" accept=".json">
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const uploadWrapper = document.getElementById('uploadWrapper');
    const fileInput = document.getElementById('fileInput');

    const DB_NAME = 'BibliotecaDB';
    const STORE_NAME = 'livros';
    let db;

    function abrirBanco() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };

        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };

        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function salvarLivros(data) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);

        Object.keys(data).forEach(id => {
          store.put({ id: id, ...data[id] });
        });

        transaction.oncomplete = () => resolve();
        transaction.onerror = (e) => reject(e.target.error);
      });
    }

    async function obterLivros() {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();

        request.onsuccess = () => {
          const resultado = request.result;
          // Ordena alfabeticamente pelo nome do livro (A-Z)
          resultado.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
          resolve(resultado);
        };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function renderizarBiblioteca(livros) {
      grid.innerHTML = '';

      if (livros.length === 0) {
        grid.innerHTML = '<div class="loading">Nenhum livro encontrado.</div>';
        return;
      }

      livros.forEach(item => {
        const wrapper = document.createElement('div');
        wrapper.className = 'item-wrapper';

        wrapper.innerHTML = `
          <a class="card" href="${item.url}" target="_blank" rel="noopener noreferrer">
            <div class="thumb-wrapper">
              <img src="${item.thumb}" alt="Capa de ${item.nome}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x260/2a2a2a/ffffff?text=Sem+Capa'">
            </div>
          </a>
          <a class="card-title" href="${item.url}" target="_blank" rel="noopener noreferrer" title="${item.nome}">
            ${item.nome}
          </a>
        `;

        grid.appendChild(wrapper);
      });
    }

    async function inicializar() {
      try {
        await abrirBanco();
        const livros = await obterLivros();

        if (livros.length > 0) {
          uploadWrapper.classList.add('hidden');
          renderizarBiblioteca(livros);
        } else {
          uploadWrapper.classList.remove('hidden');
        }
      } catch (err) {
        grid.innerHTML = `<div class="error">Erro ao acessar o banco de dados: ${err.message}</div>`;
      }
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = async (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          await salvarLivros(parsed);
          uploadWrapper.classList.add('hidden');
          const livros = await obterLivros();
          renderizarBiblioteca(livros);
        } catch (err) {
          alert('Arquivo JSON inválido ou falha ao salvar dados.');
        }
      };

      reader.readAsText(file);
    });

    inicializar();
  </script>

</body>
</html>
