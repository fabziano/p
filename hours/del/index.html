<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deletar</title>
  <style>
    body {margin: 0;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color: #212529;background-image: url("../assets/background.webp");
    background-size: cover;background-position: center;background-repeat: no-repeat;height: 100vh;}
    main{padding: 1rem;}
    button{padding:.375rem .75rem;font-size:1rem;user-select:none;color:#fff;background-color:#3c97fe;border:none;border-radius:.25rem;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <button id="btn">Deletar</button>
  </main>
  <script>
    document.getElementById('btn').addEventListener('click', () => {
      localStorage.removeItem('chave');
      window.location.href = '../';
    });
  </script>
</body>
</html>
