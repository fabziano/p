<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>CrabCare — Entrar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    width: 100%;
    overflow: auto;
}

body {
    background-color: #f4f5f7;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, sans-serif;
    padding: 0.5rem;
}

main {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

[hidden] {
    display: none !important;
}

.login {
    width: 100%;
    max-width: 24rem;
    padding: 1.5rem;
    border: 0.125rem solid #ccc;
    border-radius: 0.5rem;
    background: #fff;
    color: #333;
}

.login header {
    margin-bottom: 1.5rem;
}

.marca {
    color: #0066cc;
    font-weight: 700;
    margin-bottom: 1.5rem;
}

.login h1 {
    margin-bottom: 0.5rem;
}

.login p {
    line-height: 1.5;
}

.login form {
    display: grid;
    gap: 0.75rem;
}

.login input,
.login button {
    width: 100%;
    padding: 0.875rem;
    border: 0.125rem solid #ccc;
    border-radius: 0.5rem;
    font: inherit;
}

.login input {
    color-scheme: light;
    background-color: #fff;
    color: #333;
    caret-color: #333;
}

.login button {
    margin-top: 0.5rem;
    border-color: #0066cc;
    background-color: #0066cc;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
}

.login button:hover {
    background-color: #0052a3;
}

.login label {
    font-weight: 600;
}

.login input:focus-visible,
.login button:focus-visible,
.item:has(input:focus-visible) {
    outline: 3px solid #0066cc;
    outline-offset: 3px;
}

#escala {
    width: 100%;
    max-width: 65rem;
}

.icones {
    width: 100%;
    max-width: 65rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: stretch;
    gap: 0.5rem;
}

.item {
    flex: 1 1 30%;
    min-width: 0;
    max-width: 10rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    padding: 0.5rem 0.25rem;
    border: 0.125rem solid #ccc;
    border-radius: 0.5rem;
    background-color: #fff;
    cursor: pointer;
    position: relative;
    transition: all 0.2s ease;
}

.item input[type="radio"] {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.item:has(input[type="radio"]:checked) {
    border-color: #0066cc;
    background-color: #f0f7ff;
    box-shadow: 0 0 0.5rem rgba(0, 102, 204, 0.2);
}

@media (min-width: 48rem) {
    .icones {
        gap: 1rem;
    }
    .item {
        flex: 1 1 15%;
        padding: 0.75rem 0.5rem;
    }
}

.face-svg {
    width: 100%;
    max-width: 4.5rem;
    height: auto;
    aspect-ratio: 1 / 1;
    overflow: visible;
    pointer-events: none;
    filter: drop-shadow(0 0.2rem 0.2rem rgba(0, 0, 0, 0.12));
}

@media (min-width: 48rem) {
    .face-svg {
        max-width: 5rem;
    }
}

.item span {
    width: 100%;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    color: #333;
    line-height: 1.1;
    margin-top: 0.3rem;
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
    </style>
    <script src="icones.js" defer></script>
</head>

<body>
    <main>
        <section class="login" aria-labelledby="login-titulo">
            <header>
                <p class="marca">CrabCare</p>
                <h1 id="login-titulo">Bem-vindo</h1>
                <p>Entre para registrar como você está se sentindo.</p>
            </header>
            <form id="login-form">
                <label for="usuario">Usuário</label>
                <input id="usuario" name="usuario" type="text" value="paciente" autocomplete="username" required>
                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" value="1234" autocomplete="current-password" required>
                <button type="submit">Entrar</button>
            </form>
        </section>
        <section id="escala" aria-label="Escala de dor" hidden>
        <form class="icones">
            <label class="item">
                <input type="radio" name="escala-dor" value="sem_dor">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-1"></svg>
                <span>Sem dor</span>
            </label>

            <label class="item">
                <input type="radio" name="escala-dor" value="dor_leve">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-2"></svg>
                <span>Dor leve</span>
            </label>

            <label class="item">
                <input type="radio" name="escala-dor" value="dor_moderada">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-3"></svg>
                <span>Dor moderada</span>
            </label>

            <label class="item">
                <input type="radio" name="escala-dor" value="dor_intensa">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-4"></svg>
                <span>Dor intensa</span>
            </label>

            <label class="item">
                <input type="radio" name="escala-dor" value="dor_muito_intensa">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-4-intensa"></svg>
                <span>Dor muito intensa</span>
            </label>

            <label class="item">
                <input type="radio" name="escala-dor" value="pior_dor_possivel">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-5"></svg>
                <span>Pior dor possível</span>
            </label>
        </form>
        </section>
    </main>

    <audio id="audio-player"></audio>

    <script>
        document.getElementById('login-form').addEventListener('submit', event => {
            event.preventDefault();
            document.querySelector('.login').hidden = true;
            document.getElementById('escala').hidden = false;
            document.title = 'CrabCare — Escala de dor';
            document.querySelector('input[name="escala-dor"]').focus();
        });

        const audioPlayer = document.getElementById('audio-player');
        const items = document.querySelectorAll('.item');

        items.forEach(item => {
            item.addEventListener('click', () => {
                const radio = item.querySelector('input[type="radio"]');
                radio.checked = true;
                const valor = radio.value;
                audioPlayer.src = `assets/audio/${valor}.mp3`;
                audioPlayer.currentTime = 0;
                audioPlayer.play().catch(err => console.log("Áudio bloqueado ou não encontrado:", err));
            });
        });
    </script>
</body>

</html>
