<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Escala de Dor - Externo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="icones.js" defer></script>
</head>

<body>
    <main>
        <section class="icones">
            <div class="item">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-1"></svg>
                <span>Sem dor</span>
            </div>

            <div class="item">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-2"></svg>
                <span>Dor leve</span>
            </div>

            <div class="item">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-3"></svg>
                <span>Dor moderada</span>
            </div>

            <div class="item">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-4"></svg>
                <span>Dor intensa</span>
            </div>

            <div class="item">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-4-intensa"></svg>
                <span>Dor muito intensa</span>
            </div>

            <div class="item">
                <svg class="face-svg" viewBox="-50 -50 100 100" data-icon="face-5"></svg>
                <span>Pior dor possível</span>
            </div>
        </section>
    </main>
</body>

</html>
