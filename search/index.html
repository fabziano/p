<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Acadêmica</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%238ae234' d='M512 124.7L256 18 0 124.7l256 106.7L512 124.7z M256 274l-144.9-67.6L0 252.7l256 106.7l256-106.7l-111.1-46.3L256 274z M256 402l-139.6-69.8L0 380.7l256 106.7l256-106.7l-116.4-48.5L256 402z'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root{--bg-color:#061424;--surface-color:#0b213a;--active-color:#3b82f6;--button-text-color:#ffffff;}
        body{background-color:var(--bg-color);color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:background-color .2s ease;}
        header{background-color:var(--surface-color);border-bottom:1px solid #334155;transition:background-color .2s ease;}
        .navbar-toggler{border-color:#334155;}
        .navbar-toggler-icon{background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28248, 250, 252, 0.75%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3E");}
        .nav-btn{background:none;border:none;padding:.875rem 1.125rem;font-size:.875rem;font-weight:500;color:#94a3b8;cursor:pointer;outline:none;position:relative;text-align:left;width:100%;}
        @media (min-width:992px){.nav-btn{text-align:center;width:auto;}}
        .nav-btn.active{color:#ffffff;font-weight:500;}
        .nav-btn.active::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;background-color:var(--active-color);}
        @media (max-width:991.98px){.nav-btn.active::after{display:none;}.nav-btn.active{background-color:rgba(255,255,255,.05);border-left:3px solid var(--active-color);}}
        main{flex:1;width:100%;max-width:32.5rem;margin:0 auto;padding:2.5rem 1.25rem;display:flex;flex-direction:column;justify-content:center;align-items:center;}
        .form-control,.form-control:focus{background-color:var(--surface-color);border-color:#334155;color:#f8fafc;box-shadow:none;}
        .form-control:focus{border-color:var(--active-color);}
        .form-control::placeholder{color:#64748b;}
        .btn-submit,.btn-submit:hover,.btn-submit:focus,.btn-submit:active{background-color:var(--active-color)!important;color:var(--button-text-color)!important;border:none!important;padding:.6875rem;border-radius:.375rem;font-weight:600;font-size:.875rem;width:100%;opacity:1!important;box-shadow:none!important;}
        
        /* Cores Temáticas */
        /* 1º - Azul */
        .nav-btn[data-value="raphael"].active{--bg-color:#061424;--surface-color:#0b213a;--active-color:#3b82f6;--button-text-color:#ffffff;}
        /* 2º - Roxo */
        .nav-btn[data-value="donatello"].active{--bg-color:#140824;--surface-color:#220e3d;--active-color:#a855f7;--button-text-color:#ffffff;}
        /* 3º - Laranja */
        .nav-btn[data-value="connectedpapers"].active{--bg-color:#241408;--surface-color:#3d200e;--active-color:#f97316;--button-text-color:#ffffff;}
    </style>
</head>

<body>

    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg py-0">
            <div class="container-fluid max-w-7xl">
                <span class="navbar-brand text-light fs-6 fw-semibold d-lg-none py-3"
                    id="mobile-current-platform">Anna's Archive</span>
                <button class="navbar-toggler py-2 px-2.5" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center py-2 py-lg-0" id="navbarContent">
                    <div class="navbar-nav w-100 justify-content-center" id="platform-nav">
                        <button type="button" class="nav-btn active" data-value="raphael" data-bs-dismiss="collapse"
                            data-bs-target=".navbar-collapse.show">Anna's Archive</button>
                        <button type="button" class="nav-btn" data-value="donatello" data-bs-dismiss="collapse"
                            data-bs-target=".navbar-collapse.show">arXiv</button>
                        <button type="button" class="nav-btn" data-value="connectedpapers" data-bs-dismiss="collapse"
                            data-bs-target=".navbar-collapse.show">Connected Papers</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="w-100">
            <h3 class="text-center fs-5 fw-semibold mb-4 text-light" id="platform-title">Anna's Archive</h3>
            <form id="search-form" action="https://annas-archive.gd/search" method="get" target="_blank" class="w-100">
                <div class="mb-3">
                    <input type="text" id="search-input" name="q" placeholder="Digite sua pesquisa..."
                        aria-label="Digite sua pesquisa" class="form-control" required>
                </div>
                <div id="extra-inputs"></div>
                <button type="submit" class="btn btn-submit mt-2">Buscar</button>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const PLATFORMS = {
            raphael: { 
                name: "Anna's Archive", 
                action: 'https://annas-archive.gd/search', 
                param: 'q',
                transform: query => query
            },
            donatello: { 
                name: 'arXiv', 
                action: 'https://arxiv.org/search/', 
                param: 'query',
                transform: query => query,
                extras: { searchtype: 'all' }
            },
            connectedpapers: { 
                name: 'Connected Papers', 
                action: 'https://www.connectedpapers.com/search', 
                param: 'q',
                transform: query => query
            }
        };

        let currentPlatform = 'raphael';

        const navButtons = document.querySelectorAll('.nav-btn');
        const platformTitle = document.getElementById('platform-title');
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const extraInputs = document.getElementById('extra-inputs');
        const mobileTitle = document.getElementById('mobile-current-platform');

        function updatePlatform(target) {
            const config = PLATFORMS[target];
            if (!config) return;

            currentPlatform = target;
            platformTitle.textContent = config.name;
            searchForm.action = config.action;
            searchInput.name = config.param;

            extraInputs.innerHTML = '';
            if (config.extras) {
                Object.entries(config.extras).forEach(([key, val]) => {
                    const hidden = document.createElement('input');
                    hidden.type = 'hidden';
                    hidden.name = key;
                    hidden.value = val;
                    extraInputs.appendChild(hidden);
                });
            }
        }

        navButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.getAttribute('data-value');

                navButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const style = getComputedStyle(btn);
                document.documentElement.style.setProperty('--bg-color', style.getPropertyValue('--bg-color').trim());
                document.documentElement.style.setProperty('--surface-color', style.getPropertyValue('--surface-color').trim());
                document.documentElement.style.setProperty('--active-color', style.getPropertyValue('--active-color').trim());
                document.documentElement.style.setProperty('--button-text-color', style.getPropertyValue('--button-text-color').trim());

                if (mobileTitle) {
                    mobileTitle.textContent = btn.textContent;
                }

                updatePlatform(target);
            });
        });

        searchForm.addEventListener('submit', (e) => {
            const config = PLATFORMS[currentPlatform];
            if (config && config.transform) {
                searchInput.value = config.transform(searchInput.value.trim());
            }
        });

        updatePlatform('raphael');
    </script>
</body>

</html>
