<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%238ae234' d='M512 124.7L256 18 0 124.7l256 106.7L512 124.7z M256 274l-144.9-67.6L0 252.7l256 106.7l256-106.7l-111.1-46.3L256 274z M256 402l-139.6-69.8L0 380.7l256 106.7l256-106.7l-116.4-48.5L256 402z'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1329;
            --surface-color: #16203a;
            --active-color: #4285f4;
            --button-text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s ease;
        }

        header {
            background-color: var(--surface-color);
            border-bottom: 1px solid #334155;
            transition: background-color 0.2s ease;
        }

        .navbar-toggler {
            border-color: #334155;
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28248, 250, 252, 0.75%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        .nav-btn {
            background: none;
            border: none;
            padding: 0.875rem 1.125rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #94a3b8;
            cursor: pointer;
            outline: none;
            position: relative;
            text-align: left;
            width: 100%;
        }

        @media (min-width: 992px) {
            .nav-btn {
                text-align: center;
                width: auto;
            }
        }

        .nav-btn.active {
            color: #ffffff;
            font-weight: 500;
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--active-color);
        }

        @media (max-width: 991.98px) {
            .nav-btn.active::after {
                display: none;
            }

            .nav-btn.active {
                background-color: rgba(255, 255, 255, 0.05);
                border-left: 3px solid var(--active-color);
            }
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 32.5rem;
            margin: 0 auto;
            padding: 2.5rem 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .form-control,
        .form-control:focus {
            background-color: var(--surface-color);
            border-color: #334155;
            color: #f8fafc;
            box-shadow: none;
        }

        .form-control:focus {
            border-color: var(--active-color);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-label,
        legend {
            font-size: 0.8125rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 0.375rem;
        }

        .form-check-input {
            background-color: var(--surface-color);
            border-color: #334155;
        }

        .form-check-input:checked {
            background-color: var(--active-color);
            border-color: var(--active-color);
        }

        .btn-submit,
        .btn-submit:hover,
        .btn-submit:focus,
        .btn-submit:active {
            background-color: var(--active-color) !important;
            color: var(--button-text-color) !important;
            border: none !important;
            padding: 0.6875rem;
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: 0.875rem;
            width: 100%;
            opacity: 1 !important;
            box-shadow: none !important;
        }

        .nav-btn[data-value="scholar"].active {
            --bg-color: #0b1329;
            --surface-color: #16203a;
            --active-color: #4285f4;
            --button-text-color: #ffffff;
        }

        .nav-btn[data-value="scielo"].active {
            --bg-color: #230914;
            --surface-color: #341220;
            --active-color: #f43f5e;
            --button-text-color: #ffffff;
        }

        .nav-btn[data-value="arxiv"].active {
            --bg-color: #170b24;
            --surface-color: #251238;
            --active-color: #a855f7;
            --button-text-color: #ffffff;
        }

        .nav-btn[data-value="ieee"].active {
            --bg-color: #061824;
            --surface-color: #0e2536;
            --active-color: #06b6d4;
            --button-text-color: #ffffff;
        }

        .nav-btn[data-value="annas"].active {
            --bg-color: #241209;
            --surface-color: #381c0e;
            --active-color: #f97316;
            --button-text-color: #ffffff;
        }

        .nav-btn[data-value="oamg"].active {
            --bg-color: #071a14;
            --surface-color: #0d2a20;
            --active-color: #10b981;
            --button-text-color: #ffffff;
        }

        .nav-btn[data-value="consensus"].active {
            --bg-color: #10122e;
            --surface-color: #1b1e47;
            --active-color: #6366f1;
            --button-text-color: #ffffff;
        }

        .nav-btn[data-value="connectedpapers"].active {
            --bg-color: #262006;
            --surface-color: #38300a;
            --active-color: #eab308;
            --button-text-color: #0f172a;
        }
    </style>
</head>

<body>

    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg py-0">
            <div class="container-fluid max-w-7xl">
                <span class="navbar-brand text-light fs-6 fw-semibold d-lg-none py-3"
                    id="mobile-current-platform">Google Acadêmico</span>
                <button class="navbar-toggler py-2 px-2.5" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center py-2 py-lg-0" id="navbarContent">
                    <div class="navbar-nav w-100 justify-content-center" id="platform-nav">
                        <button type="button" class="nav-btn active" data-value="scholar" data-bs-dismiss="collapse"
                            data-bs-target=".navbar-collapse.show">Google Acadêmico</button>
                        <button type="button" class="nav-btn" data-value="scielo" data-bs-dismiss="collapse"
                            data-bs-target=".navbar-collapse.show">SciELO</button>
                        <button type="button" class="nav-btn" data-value="arxiv" data-bs-dismiss="collapse"
                            data-bs-target=".navbar-collapse.show">arXiv</button>
                        <button type="button" class="nav-btn" data-value="ieee" data-bs-dismiss="collapse"
                            data-bs-target=".navbar-collapse.show">IEEE Xplore</button>
                        <button type="button" class="nav-btn" data-value="annas" data-bs-dismiss="collapse"
                            data-bs-target=".navbar-collapse.show">Anna's Archive</button>
                        <button type="button" class="nav-btn" data-value="oamg" data-bs-dismiss="collapse"
                            data-bs-target=".navbar-collapse.show">OA.mg</button>
                        <button type="button" class="nav-btn" data-value="consensus" data-bs-dismiss="collapse"
                            data-bs-target=".navbar-collapse.show">Consensus</button>
                        <button type="button" class="nav-btn" data-value="connectedpapers" data-bs-dismiss="collapse"
                            data-bs-target=".navbar-collapse.show">Connected Papers</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="scholar-section" class="w-100">
            <form id="scholar-form" action="https://scholar.google.com/scholar" method="get" target="_blank"
                class="w-100">

                <input type="hidden" id="scholar-final-query" name="q">

                <div class="mb-3">
                    <label for="as_q" class="form-label">Com todas as palavras</label>
                    <input type="text" id="as_q" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="as_epq" class="form-label">Com a frase exata</label>
                    <input type="text" id="as_epq" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="as_oq" class="form-label">Com no mínimo uma das palavras</label>
                    <input type="text" id="as_oq" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="as_eq" class="form-label">Sem as palavras</label>
                    <input type="text" id="as_eq" class="form-control">
                </div>

                <fieldset class="mb-3">
                    <legend>Onde ocorrem</legend>
                    <div class="d-flex gap-4 mt-1">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="any" name="as_occt" value="any" checked>
                            <label class="form-check-label text-light fs-7" for="any">Qualquer lugar</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="title" name="as_occt" value="title">
                            <label class="form-check-label text-light fs-7" for="title">No título</label>
                        </div>
                    </div>
                </fieldset>

                <div class="mb-3">
                    <label for="as_sauthors" class="form-label">Autoria de</label>
                    <input type="text" id="as_sauthors" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Intervalo de anos</label>
                    <div class="d-flex align-items-center gap-2">
                        <input type="text" id="as_ylo" name="as_ylo" placeholder="Inicial"
                            class="form-control text-center" style="width: 90px;">
                        <span class="text-secondary">—</span>
                        <input type="text" id="as_yhi" name="as_yhi" placeholder="Final" aria-label="Ano final"
                            class="form-control text-center" style="width: 90px;">
                    </div>
                </div>

                <button type="submit" class="btn btn-submit mt-2">Buscar</button>
            </form>
        </section>

        <section id="standard-section" class="d-none w-100">
            <h3 class="text-center fs-5 fw-semibold mb-4 text-light" id="platform-title">SciELO</h3>
            <form id="standard-form" action="https://search.scielo.org/" method="get" target="_blank" class="w-100">
                <div class="mb-3">
                    <input type="text" id="search-input" name="q" placeholder="Digite sua pesquisa..."
                        aria-label="Digite sua pesquisa" class="form-control">
                </div>

                <output id="hidden-inputs"></output>

                <button type="submit" class="btn btn-submit mt-2">Buscar</button>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="default.js"></script>
    <script src="scholar.js"></script>
    <script>
        const mobileTitle = document.getElementById('mobile-current-platform');

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const style = getComputedStyle(btn);
                document.documentElement.style.setProperty('--bg-color', style.getPropertyValue('--bg-color').trim());
                document.documentElement.style.setProperty('--surface-color', style.getPropertyValue('--surface-color').trim());
                document.documentElement.style.setProperty('--active-color', style.getPropertyValue('--active-color').trim());
                document.documentElement.style.setProperty('--button-text-color', style.getPropertyValue('--button-text-color').trim());

                if (mobileTitle) {
                    mobileTitle.textContent = btn.textContent;
                }
            });
        });
    </script>
</body>

</html>
